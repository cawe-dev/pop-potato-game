version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    container_name: pop_potato_game_prod
    restart: always
    env_file:
      - .env
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DATABASE_URL=ecto://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      - PORT=4000
      - PHX_HOST=${DOMAIN_NAME:-localhost}
    networks:
      - pop_potato_game-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: pop_potato_game_db_prod
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - pop_potato_game-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: pop_potato_game_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pop_potato_game-network

networks:
  pop_potato_game-network:
    driver: bridge

volumes:
  db_data_prod:
    driver: local