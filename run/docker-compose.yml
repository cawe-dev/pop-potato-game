version: '3.9'
name: pop_potato

services:
  app:
    build:
      context: ../
      dockerfile: run/php/Dockerfile
    container_name: pop_potato_app
    restart: always
    volumes:
      - ../:/var/www/application
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis

  nginx:
    image: nginx:alpine
    container_name: pop_potato_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/application
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    build: ./db
    container_name: pop_potato_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pop_potato_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 5s

  redis:
    build: ./redis
    container_name: pop_potato_redis
    restart: always
    volumes:
      - pop_potato_dev_redis_data:/data

volumes:
  pop_potato_dev_data:
  pop_potato_dev_redis_data: